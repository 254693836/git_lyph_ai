<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game001 Tank Battle</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #17191d;
      --panel: #242832;
      --panel-2: #303642;
      --text: #f3f0e8;
      --muted: #aeb7c2;
      --accent: #f3c55b;
      --danger: #e15b4f;
      --steel: #7f93a6;
      --grass: #556f43;
      --brick: #a9563d;
      --water: #2b6c8f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(243, 197, 91, 0.09), transparent 36%),
        radial-gradient(circle at 80% 18%, rgba(43, 108, 143, 0.18), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
    }

    .shell {
      width: min(1120px, 100vw);
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 704px) 300px;
      gap: 20px;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .playfield {
      position: relative;
      width: min(704px, calc(100vw - 44px));
      aspect-ratio: 1;
      border: 4px solid #0d0f12;
      background: #111316;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.36);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      background: #111316;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 28px;
      background: rgba(10, 12, 15, 0.76);
      text-align: center;
    }

    .overlay.visible {
      display: grid;
    }

    .overlay h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 7vw, 62px);
      line-height: 1;
      letter-spacing: 0;
      color: var(--accent);
      text-transform: uppercase;
    }

    .overlay p {
      max-width: 460px;
      margin: 0 auto 18px;
      color: var(--muted);
      line-height: 1.7;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 0 18px;
      background: var(--accent);
      color: #20170a;
      font-weight: 800;
      cursor: pointer;
    }

    .side {
      align-self: stretch;
      min-height: 704px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }

    .title {
      margin: 0 0 2px;
      font-size: 32px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0 0 8px;
      color: var(--muted);
      line-height: 1.6;
    }

    .stats,
    .controls,
    .legend {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      min-height: 64px;
      display: grid;
      align-content: center;
      gap: 4px;
      padding: 10px;
      background: var(--panel-2);
      border-radius: 6px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .value {
      font-size: 24px;
      font-weight: 800;
    }

    .controls {
      display: grid;
      gap: 9px;
      color: var(--muted);
      line-height: 1.45;
    }

    .key {
      display: inline-grid;
      place-items: center;
      min-width: 28px;
      height: 28px;
      margin-right: 5px;
      border-radius: 5px;
      background: var(--panel-2);
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
    }

    .legend {
      display: grid;
      gap: 9px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
    }

    .swatch {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(0, 0, 0, 0.25);
      flex: 0 0 auto;
    }

    .brick { background: var(--brick); }
    .steel { background: var(--steel); }
    .grass { background: var(--grass); }
    .water { background: var(--water); }

    @media (max-width: 900px) {
      body {
        place-items: start center;
      }

      .shell {
        grid-template-columns: 1fr;
        align-items: start;
        padding: 14px;
      }

      .playfield {
        width: min(704px, calc(100vw - 28px));
        margin: 0 auto;
      }

      .side {
        min-height: auto;
        width: min(704px, calc(100vw - 28px));
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="playfield" aria-label="タンク戦車ゲーム">
      <canvas id="game" width="704" height="704"></canvas>
      <div class="overlay visible" id="overlay">
        <div>
          <h1 id="overlayTitle">Tank Battle</h1>
          <p id="overlayText">敵戦車を倒しながら、下部中央の基地を守ってください。</p>
          <button id="startButton">START</button>
        </div>
      </div>
    </section>

    <aside class="side">
      <div>
        <h2 class="title">Game001<br>Tank Battle</h2>
        <p class="subtitle">クラシックな見下ろし型タンク戦車ゲームです。</p>
      </div>

      <section class="stats" aria-label="ゲーム情報">
        <div class="stat">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="label">Lives</span>
          <span class="value" id="lives">3</span>
        </div>
        <div class="stat">
          <span class="label">Enemies</span>
          <span class="value" id="enemies">0</span>
        </div>
        <div class="stat">
          <span class="label">Wave</span>
          <span class="value" id="wave">1</span>
        </div>
      </section>

      <section class="controls" aria-label="操作方法">
        <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>移動</div>
        <div><span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span>移動</div>
        <div><span class="key">Space</span>発射</div>
        <div><span class="key">R</span>リスタート</div>
      </section>

      <section class="legend" aria-label="地形">
        <div class="legend-row"><span class="swatch brick"></span>レンガ壁: 弾で破壊できます</div>
        <div class="legend-row"><span class="swatch steel"></span>鉄壁: 破壊できません</div>
        <div class="legend-row"><span class="swatch grass"></span>森: 戦車が隠れます</div>
        <div class="legend-row"><span class="swatch water"></span>水: 通れません</div>
      </section>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const startButton = document.getElementById("startButton");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const enemiesEl = document.getElementById("enemies");
    const waveEl = document.getElementById("wave");

    const TILE = 32;
    const MAP = 22;
    const SIZE = TILE * MAP;
    const PLAYER = "player";
    const ENEMY = "enemy";
    const dirs = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    };

    const keys = new Set();
    const bullets = [];
    const enemies = [];
    const effects = [];
    let terrain = [];
    let player;
    let base;
    let score = 0;
    let lives = 3;
    let wave = 1;
    let enemiesLeft = 12;
    let spawnTimer = 0;
    let lastTime = 0;
    let running = false;
    let gameOver = false;

    const baseMap = [
      "......................",
      "...B..B........B..B...",
      "...B..B..SSSS..B..B...",
      "......B........B......",
      ".BBBB.B..WWWW..B.BBBB.",
      "......B..WWWW..B......",
      "..SS......BB......SS..",
      "....BBBB......BBBB....",
      "..........GG..........",
      "....GGGG..GG..GGGG....",
      "....GGGG......GGGG....",
      "..B....B..SS..B....B..",
      "..B....B......B....B..",
      "......BBBB..BBBB......",
      ".WW....G......G....WW.",
      ".WW....G......G....WW.",
      "...SS....BBBB....SS...",
      ".........B..B.........",
      "...BBBB..B..B..BBBB...",
      ".........B..B.........",
      "........BBBBBB........",
      "..........HH.........."
    ];

    terrain = baseMap.map((row) => row.split(""));

    function resetGame() {
      terrain = baseMap.map((row) => row.split(""));
      bullets.length = 0;
      enemies.length = 0;
      effects.length = 0;
      score = 0;
      lives = 3;
      wave = 1;
      enemiesLeft = 12;
      spawnTimer = 0;
      gameOver = false;
      running = true;
      base = { x: 10 * TILE, y: 21 * TILE, w: TILE * 2, h: TILE, alive: true };
      player = makeTank(10.5 * TILE, 19 * TILE, PLAYER);
      updateHud();
      hideOverlay();
    }

    function makeTank(x, y, type) {
      return {
        x,
        y,
        w: 28,
        h: 28,
        type,
        dir: type === PLAYER ? "up" : "down",
        speed: type === PLAYER ? 124 : 72 + Math.min(wave * 5, 30),
        cooldown: 0,
        changeTimer: 0.35,
        shootTimer: 0.8 + Math.random() * 0.8,
        invincible: type === PLAYER ? 1.2 : 0
      };
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      enemiesEl.textContent = enemiesLeft + enemies.length;
      waveEl.textContent = wave;
    }

    function showOverlay(title, text, buttonText = "RESTART") {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      startButton.textContent = buttonText;
      overlay.classList.add("visible");
    }

    function hideOverlay() {
      overlay.classList.remove("visible");
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function blockedTiles(rect) {
      const hits = [];
      const minX = Math.max(0, Math.floor(rect.x / TILE));
      const maxX = Math.min(MAP - 1, Math.floor((rect.x + rect.w - 1) / TILE));
      const minY = Math.max(0, Math.floor(rect.y / TILE));
      const maxY = Math.min(MAP - 1, Math.floor((rect.y + rect.h - 1) / TILE));
      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          if ("BSWH".includes(terrain[y][x])) {
            hits.push({ x, y, type: terrain[y][x] });
          }
        }
      }
      return hits;
    }

    function canMove(tank, nx, ny) {
      const rect = { x: nx, y: ny, w: tank.w, h: tank.h };
      if (rect.x < 0 || rect.y < 0 || rect.x + rect.w > SIZE || rect.y + rect.h > SIZE) return false;
      if (blockedTiles(rect).length) return false;

      const others = tank.type === PLAYER ? enemies : [player, ...enemies.filter((enemy) => enemy !== tank)];
      return !others.some((other) => other && rectsOverlap(rect, other));
    }

    function moveTank(tank, dt) {
      const d = dirs[tank.dir];
      const nx = tank.x + d.x * tank.speed * dt;
      const ny = tank.y + d.y * tank.speed * dt;
      if (canMove(tank, nx, ny)) {
        tank.x = nx;
        tank.y = ny;
        return true;
      }
      return false;
    }

    function shoot(tank) {
      if (tank.cooldown > 0) return;
      const d = dirs[tank.dir];
      bullets.push({
        x: tank.x + tank.w / 2 - 4 + d.x * 15,
        y: tank.y + tank.h / 2 - 4 + d.y * 15,
        w: 8,
        h: 8,
        dir: tank.dir,
        owner: tank.type,
        speed: tank.type === PLAYER ? 320 : 250
      });
      tank.cooldown = tank.type === PLAYER ? 0.34 : 0.9;
    }

    function spawnEnemy() {
      if (enemiesLeft <= 0 || enemies.length >= 4) return;
      const spots = [
        { x: 1 * TILE, y: 1 * TILE },
        { x: 10.5 * TILE, y: 1 * TILE },
        { x: 20 * TILE - 28, y: 1 * TILE }
      ];
      const spot = spots[Math.floor(Math.random() * spots.length)];
      const tank = makeTank(spot.x, spot.y, ENEMY);
      if (canMove(tank, tank.x, tank.y)) {
        enemies.push(tank);
        enemiesLeft--;
      }
    }

    function updatePlayer(dt) {
      if (!player) return;
      player.cooldown = Math.max(0, player.cooldown - dt);
      player.invincible = Math.max(0, player.invincible - dt);

      const previous = player.dir;
      if (keys.has("arrowup") || keys.has("w")) player.dir = "up";
      else if (keys.has("arrowdown") || keys.has("s")) player.dir = "down";
      else if (keys.has("arrowleft") || keys.has("a")) player.dir = "left";
      else if (keys.has("arrowright") || keys.has("d")) player.dir = "right";

      const moving = keys.has("arrowup") || keys.has("w") || keys.has("arrowdown") || keys.has("s") ||
        keys.has("arrowleft") || keys.has("a") || keys.has("arrowright") || keys.has("d");
      if (moving || player.dir !== previous) moveTank(player, dt);
      if (keys.has(" ")) shoot(player);
    }

    function updateEnemies(dt) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = Math.max(0.7, 2.1 - wave * 0.12);
      }

      for (const enemy of enemies) {
        enemy.cooldown = Math.max(0, enemy.cooldown - dt);
        enemy.changeTimer -= dt;
        enemy.shootTimer -= dt;

        if (enemy.changeTimer <= 0) {
          const bias = Math.random() < 0.45 ? (enemy.x < base.x ? "right" : enemy.x > base.x + TILE ? "left" : "down") : null;
          enemy.dir = bias || ["up", "down", "left", "right"][Math.floor(Math.random() * 4)];
          enemy.changeTimer = 0.45 + Math.random() * 0.9;
        }

        if (!moveTank(enemy, dt)) {
          enemy.dir = ["up", "down", "left", "right"][Math.floor(Math.random() * 4)];
        }

        if (enemy.shootTimer <= 0) {
          shoot(enemy);
          enemy.shootTimer = 0.7 + Math.random() * 1.2;
        }
      }
    }

    function damageBase() {
      base.alive = false;
      running = false;
      gameOver = true;
      showOverlay("Game Over", "基地が破壊されました。スコア " + score + " 点です。");
    }

    function hitPlayer() {
      if (!player || player.invincible > 0) return;
      lives--;
      effects.push({ x: player.x + 14, y: player.y + 14, life: 0.4, color: "#f3c55b" });
      if (lives <= 0) {
        running = false;
        gameOver = true;
        showOverlay("Game Over", "戦車がすべて撃破されました。スコア " + score + " 点です。");
      } else {
        player.x = 10.5 * TILE;
        player.y = 19 * TILE;
        player.dir = "up";
        player.invincible = 1.6;
      }
      updateHud();
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        const d = dirs[bullet.dir];
        bullet.x += d.x * bullet.speed * dt;
        bullet.y += d.y * bullet.speed * dt;

        if (bullet.x < -8 || bullet.y < -8 || bullet.x > SIZE || bullet.y > SIZE) {
          bullets.splice(i, 1);
          continue;
        }

        const tileHits = blockedTiles(bullet);
        if (tileHits.length) {
          const hit = tileHits[0];
          if (hit.type === "B") {
            terrain[hit.y][hit.x] = ".";
            effects.push({ x: hit.x * TILE + 16, y: hit.y * TILE + 16, life: 0.25, color: "#d77855" });
          } else if (hit.type === "H") {
            damageBase();
          }
          bullets.splice(i, 1);
          continue;
        }

        if (bullet.owner === PLAYER) {
          const enemyIndex = enemies.findIndex((enemy) => rectsOverlap(bullet, enemy));
          if (enemyIndex >= 0) {
            const enemy = enemies[enemyIndex];
            effects.push({ x: enemy.x + 14, y: enemy.y + 14, life: 0.42, color: "#f3c55b" });
            enemies.splice(enemyIndex, 1);
            bullets.splice(i, 1);
            score += 100;
            if (enemiesLeft + enemies.length === 0) {
              wave++;
              enemiesLeft = 10 + wave * 3;
              spawnTimer = 1;
              terrain = baseMap.map((row) => row.split(""));
              terrain[21][10] = "H";
              terrain[21][11] = "H";
              player.x = 10.5 * TILE;
              player.y = 19 * TILE;
            }
            updateHud();
            continue;
          }
        } else if (player && rectsOverlap(bullet, player)) {
          bullets.splice(i, 1);
          hitPlayer();
          continue;
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
          if (j !== i && bullets[j] && bullets[j].owner !== bullet.owner && rectsOverlap(bullet, bullets[j])) {
            bullets.splice(Math.max(i, j), 1);
            bullets.splice(Math.min(i, j), 1);
            break;
          }
        }
      }
    }

    function updateEffects(dt) {
      for (let i = effects.length - 1; i >= 0; i--) {
        effects[i].life -= dt;
        if (effects[i].life <= 0) effects.splice(i, 1);
      }
    }

    function update(dt) {
      if (!running) return;
      updatePlayer(dt);
      updateEnemies(dt);
      updateBullets(dt);
      updateEffects(dt);
      updateHud();
    }

    function drawTerrain() {
      ctx.fillStyle = "#111316";
      ctx.fillRect(0, 0, SIZE, SIZE);

      for (let y = 0; y < MAP; y++) {
        for (let x = 0; x < MAP; x++) {
          const t = terrain[y][x];
          const px = x * TILE;
          const py = y * TILE;
          if (t === "B") {
            ctx.fillStyle = "#9d4d37";
            ctx.fillRect(px, py, TILE, TILE);
            ctx.fillStyle = "rgba(255,255,255,0.14)";
            ctx.fillRect(px, py + 8, TILE, 2);
            ctx.fillRect(px, py + 20, TILE, 2);
            ctx.fillRect(px + 14, py, 2, 10);
            ctx.fillRect(px + 6, py + 10, 2, 12);
            ctx.fillRect(px + 22, py + 22, 2, 10);
          } else if (t === "S") {
            ctx.fillStyle = "#7f93a6";
            ctx.fillRect(px, py, TILE, TILE);
            ctx.strokeStyle = "#536272";
            ctx.lineWidth = 3;
            ctx.strokeRect(px + 4, py + 4, TILE - 8, TILE - 8);
          } else if (t === "W") {
            ctx.fillStyle = "#2b6c8f";
            ctx.fillRect(px, py, TILE, TILE);
            ctx.strokeStyle = "rgba(255,255,255,0.24)";
            ctx.beginPath();
            ctx.moveTo(px + 4, py + 12);
            ctx.quadraticCurveTo(px + 12, py + 6, px + 20, py + 12);
            ctx.quadraticCurveTo(px + 26, py + 17, px + 30, py + 12);
            ctx.stroke();
          } else if (t === "H") {
            ctx.fillStyle = base && base.alive ? "#f3c55b" : "#4c3d2a";
            ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
            ctx.fillStyle = "#2a2217";
            ctx.beginPath();
            ctx.moveTo(px + 16, py + 8);
            ctx.lineTo(px + 25, py + 24);
            ctx.lineTo(px + 7, py + 24);
            ctx.closePath();
            ctx.fill();
          }
        }
      }
    }

    function drawTank(tank) {
      const cx = tank.x + tank.w / 2;
      const cy = tank.y + tank.h / 2;
      const angle = { up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 }[tank.dir];
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      const body = tank.type === PLAYER ? "#d6b44a" : "#b34d42";
      const trim = tank.type === PLAYER ? "#5e783f" : "#53333b";
      ctx.fillStyle = trim;
      ctx.fillRect(-14, -14, 7, 28);
      ctx.fillRect(7, -14, 7, 28);
      ctx.fillStyle = body;
      ctx.fillRect(-10, -12, 20, 24);
      ctx.fillStyle = "#22272e";
      ctx.fillRect(-4, -8, 8, 11);
      ctx.fillStyle = body;
      ctx.fillRect(-3, -20, 6, 19);
      ctx.fillStyle = "rgba(255,255,255,0.22)";
      ctx.fillRect(-8, -10, 4, 17);
      ctx.restore();

      if (tank.invincible > 0 && Math.floor(tank.invincible * 12) % 2 === 0) {
        ctx.strokeStyle = "#f3f0e8";
        ctx.lineWidth = 2;
        ctx.strokeRect(tank.x - 3, tank.y - 3, tank.w + 6, tank.h + 6);
      }
    }

    function drawBullets() {
      for (const bullet of bullets) {
        ctx.fillStyle = bullet.owner === PLAYER ? "#f7e7a4" : "#ff9a75";
        ctx.fillRect(bullet.x, bullet.y, bullet.w, bullet.h);
      }
    }

    function drawGrassAndEffects() {
      for (let y = 0; y < MAP; y++) {
        for (let x = 0; x < MAP; x++) {
          if (terrain[y][x] === "G") {
            ctx.fillStyle = "rgba(85, 111, 67, 0.78)";
            ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
            ctx.strokeStyle = "rgba(255,255,255,0.08)";
            ctx.beginPath();
            ctx.moveTo(x * TILE + 6, y * TILE + 25);
            ctx.lineTo(x * TILE + 12, y * TILE + 7);
            ctx.lineTo(x * TILE + 18, y * TILE + 25);
            ctx.lineTo(x * TILE + 26, y * TILE + 8);
            ctx.stroke();
          }
        }
      }

      for (const effect of effects) {
        const radius = (0.45 - effect.life) * 72;
        ctx.strokeStyle = effect.color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(effect.x, effect.y, Math.max(5, radius), 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawGrid() {
      ctx.strokeStyle = "rgba(255,255,255,0.035)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= MAP; i++) {
        ctx.beginPath();
        ctx.moveTo(i * TILE, 0);
        ctx.lineTo(i * TILE, SIZE);
        ctx.moveTo(0, i * TILE);
        ctx.lineTo(SIZE, i * TILE);
        ctx.stroke();
      }
    }

    function render() {
      drawTerrain();
      drawGrid();
      if (player) drawTank(player);
      enemies.forEach(drawTank);
      drawBullets();
      drawGrassAndEffects();
    }

    function loop(time) {
      const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
      lastTime = time;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "w", "a", "s", "d"].includes(key)) {
        event.preventDefault();
      }
      keys.add(key);
      if (key === "r") resetGame();
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    startButton.addEventListener("click", resetGame);
    render();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
